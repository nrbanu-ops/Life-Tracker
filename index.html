<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG and maskable icons; without this the home screen shows a screenshot. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#dce6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#182030" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default" lets iOS tint the status bar from theme-color, so dark mode stays dark. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Life Tracker" />
    <title>Life Tracker</title>
    <!-- The chosen palette, before any paint; src/lib/theme.ts owns the key and the rest. -->
    <script>
      try {
        var p = localStorage.getItem('life-tracker:palette')
        if (p) document.documentElement.dataset.palette = p
        if (localStorage.getItem('life-tracker:backdrop-motion') === 'off') document.documentElement.dataset.motion = 'off'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
