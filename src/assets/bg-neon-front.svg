<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1800" preserveAspectRatio="xMidYMid slice">
  <!-- Long thin evening clouds that drift across the sky. -->
  <g fill="#ffffff" opacity="0.75">
    <rect x="80" y="230" width="300" height="16" rx="8"/>
    <rect x="150" y="262" width="200" height="12" rx="6"/>
    <rect x="560" y="420" width="260" height="14" rx="7"/>
    <rect x="610" y="448" width="150" height="10" rx="5"/>
    <rect x="-40" y="640" width="220" height="12" rx="6"/>
    <rect x="420" y="760" width="180" height="10" rx="5"/>
  </g>
  <g fill="#ffc2dd" opacity="0.8">
    <rect x="120" y="300" width="160" height="8" rx="4"/>
    <rect x="590" y="476" width="200" height="8" rx="4"/>
    <rect x="460" y="790" width="120" height="7" rx="3.5"/>
  </g>
  <!-- A few gulls, far off. -->
  <g fill="none" stroke="#c99ad1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 520 300 q 14 -14 28 0 q 14 -14 28 0"/>
    <path d="M 590 340 q 10 -10 20 0 q 10 -10 20 0"/>
    <path d="M 250 520 q 12 -12 24 0 q 12 -12 24 0"/>
  </g>
</svg>
