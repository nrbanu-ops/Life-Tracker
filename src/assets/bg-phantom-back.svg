<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
      <circle cx="14" cy="14" r="5.5" fill="#6d0918"/>
    </pattern>
    <radialGradient id="glowA" cx="0.9" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="fadeA"><rect x="300" y="-200" width="900" height="900" fill="url(#glowA)"/></mask>
    <mask id="fadeB"><rect x="-300" y="1000" width="900" height="1100" fill="url(#glowB)"/></mask>
  </defs>
  <rect x="-300" y="-300" width="1500" height="2500" fill="#0e0e10"/>
  <rect x="300" y="-200" width="900" height="900" fill="url(#dots)" mask="url(#fadeA)"/>
  <rect x="-300" y="1000" width="900" height="1100" fill="url(#dots)" mask="url(#fadeB)"/>
  <!-- Torn ribbons: dark enough that grey text can cross them, with one bright edge each. -->
  <polygon points="1200,300 560,520 640,600 -300,890 -300,1010 700,690 620,610 1200,440" fill="#4f0712"/>
  <polyline points="1200,300 560,520 640,600 -300,890" fill="none" stroke="#e5102a" stroke-width="5"/>
  <polygon points="-300,1530 380,1290 300,1220 1200,950 1200,1090 470,1330 550,1400 -300,1670" fill="#38050d"/>
  <polyline points="-300,1670 550,1400 470,1330 1200,1090" fill="none" stroke="#e5102a" stroke-width="4" opacity="0.85"/>
  <polygon points="-300,2200 1200,2200 1200,1640 360,1930" fill="#4f0712"/>
  <polyline points="1200,1640 360,1930 -300,2160" fill="none" stroke="#f6f6f6" stroke-width="3" opacity="0.5"/>
</svg>
